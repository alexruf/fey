[package]
name = "fey"
version = "0.1.0"
edition = "2024"
description = "A minimal, terminal-native AI coding agent"
rust-version = "1.97.1"
repository = "https://github.com/alexruf/fey"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
ratatui = { version = "0.30.2", features = ["scrolling-regions"] }
rig = "0.42.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"] }
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
rig = { version = "0.42.0", features = ["test-utils"] }
serde_json = "1.0.151"
