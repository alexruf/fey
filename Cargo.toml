[package]
name = "fey"
version = "0.1.0"
edition = "2024"
description = "A a minimal, terminal-native AI coding agent"
rust-version = "1.97.1"
repository = "https://github.com/alexruf/fey"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
indicatif = "0.18.6"
ratatui = "0.30.2"
rig = "0.42.0"
termimad = "0.35.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
